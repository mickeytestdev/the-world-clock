<!doctype html>
<html lang="en">
  <head>
    <!-- ========================================
         PAGE INFORMATION
    ========================================= -->

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>World Clock</title>

    <!-- ========================================
         GOOGLE FONTS
    ========================================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ========================================
         STYLESHEET
    ========================================= -->

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ========================================
         WORLD CLOCK APP
    ========================================= -->

    <main class="world-clock">
      <!-- ========================================
           HEADER
      ========================================= -->

      <header>
        <h1>🌍 World Clock</h1>

        <p class="subtitle">A moment around the world</p>
      </header>

      <!-- ========================================
           THEME SELECTOR
      ========================================= -->

      <section class="theme-selector">
        <button id="default-theme">Default</button>

        <button id="cyberpunk-theme">Cyberpunk</button>

        <button id="sunset-theme">Tropical Sunset</button>
      </section>
      <!-- ========================================
           CITY SELECTOR
      ========================================= -->

      <section class="city-selector">
        <label for="city-select"> ✈️ Travel the World </label>

        <select id="city-select">
          <option value="">Select a city...</option>

          <option value="Asia/Hong_Kong">🇭🇰 Hong Kong</option>

          <option value="Africa/Johannesburg">🇿🇦 Cape Town</option>

          <option value="America/Guyana">🇬🇾 Georgetown</option>

          <option value="Europe/Tirane">🇦🇱 Tirana</option>

          <option value="Africa/Algiers">🇩🇿 Constantine</option>

          <option value="custom">🤔💭Explore somewhere new</option>
        </select>

        <div class="custom-location" id="custom-location">
          <label for="custom-city"> What place comes to mind? </label>

          <div class="custom-location-controls">
            <input
              type="text"
              id="custom-city"
              placeholder="Enter a city or place..."
              autocomplete="off"
            />

            <button id="custom-city-button" type="button">Explore</button>
          </div>
        </div>
      </section>
      <!-- ========================================
           CLOCK GRID
      ========================================= -->

      <section class="clock-grid">
        <!-- Local -->

        <article class="clock-card">
          <h2>📍 Your Local Time</h2>

          <p class="date" id="local-date">Date</p>

          <p class="time" id="local-time">Time</p>
        </article>

        <!-- Oxnard -->

        <article class="clock-card">
          <h2>🇺🇸 Oxnard</h2>

          <p class="date">Date</p>

          <p class="time">Time</p>
        </article>

        <!-- Darkhan -->

        <article class="clock-card">
          <h2>🇲🇳 Darkhan</h2>

          <p class="date">Date</p>

          <p class="time">Time</p>
        </article>

        <!-- Adelaide -->

        <article class="clock-card">
          <h2>🇦🇺 Adelaide</h2>

          <p class="date">Date</p>

          <p class="time">Time</p>
        </article>
      </section>

      <!-- ========================================
           FOOTER
      ========================================= -->

      <footer>Built by Mickey • Powered by Moment.js</footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
